<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>함께할 수 있는 날</title>
<style>
  :root { --ink:#1a2332; --muted:#5c6b7a; --line:#d7dee6; --bg:#f4f6f8; --card:#fff; --accent:#1f4e79; --amber:#b86e00; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Pretendard", "Apple SD Gothic Neo", Arial, sans-serif; color:var(--ink); background:var(--bg); }
  header { background:var(--accent); color:#fff; padding:28px 20px 22px; }
  header h1 { margin:0 0 6px; font-size:22px; font-weight:700; }
  header p { margin:0; font-size:13px; opacity:.85; line-height:1.5; }
  main { max-width:980px; margin:0 auto; padding:18px 16px 48px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .row { display:flex; flex-wrap:wrap; gap:10px; align-items:end; }
  label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  input, select { font:inherit; color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:#fff; min-width:0; }
  input[type=number] { width:88px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { padding:8px 6px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
  th { font-size:11px; color:var(--muted); font-weight:600; background:#f8fafc; }
  td:first-child, th:first-child { text-align:left; }
  .trip { color:var(--amber); font-weight:700; }
  .years { font-weight:700; }
  button { font:inherit; border:0; border-radius:8px; padding:8px 12px; cursor:pointer; }
  .add { background:var(--accent); color:#fff; }
  .del { background:#f3f4f6; color:#666; padding:4px 8px; }
  .note { font-size:12px; color:var(--muted); line-height:1.55; }
  .kpi { display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
  .kpi div { background:#f8fafc; border:1px solid var(--line); border-radius:10px; padding:10px 12px; min-width:140px; }
  .kpi b { display:block; font-size:20px; margin-top:2px; }
  h2 { font-size:15px; margin:0 0 10px; }
</style>
</head>
<body>
<header>
  <h1>함께할 수 있는 날</h1>
  <p>나이와 성별만 넣으면 통계청 2023년 생명표 기대여명이 붙습니다. 같이 움직이는 해는 기대여명에서 활동 버퍼를 뺀 값이고, 횟수는 연간 횟수 x 겹치는 해 x 성사율입니다.</p>
</header>
<main>
  <section class="card">
    <h2>나</h2>
    <div class="row">
      <label>나이 <input id="myAge" type="number" value="42" min="0" max="100"></label>
      <label>성별 <select id="mySex"><option value="m">남</option><option value="f">여</option></select></label>
      <label>활동 버퍼(년) <input id="buffer" type="number" value="5" min="0" max="20"></label>
      <label>성사율(%) <input id="rate" type="number" value="70" min="0" max="100"></label>
    </div>
    <div class="kpi" id="myKpi"></div>
  </section>
  <section class="card">
    <h2>사람</h2>
    <table>
      <thead><tr><th>관계</th><th>나이</th><th>성별</th><th>만남/년</th><th>식사/년</th><th>당일/년</th><th>숙박/년</th><th>통화/년</th><th></th></tr></thead>
      <tbody id="people"></tbody>
    </table>
    <p><button class="add" id="addBtn">사람 추가</button></p>
    <p class="note">같은 집 식사는 일상입니다. 비교는 부모, 형제, 친구의 식사와 숙박을 보세요.</p>
  </section>
  <section class="card">
    <h2>남은 횟수</h2>
    <table>
      <thead><tr><th>관계</th><th>기대여명</th><th>같이 움직일 해</th><th>만남</th><th>식사</th><th>당일</th><th>숙박 여행</th><th>통화</th></tr></thead>
      <tbody id="out"></tbody>
    </table>
    <p class="note">출처: 통계청 2023년 생명표. 개인 건강은 반영하지 않습니다.</p>
  </section>
</main>
<script>
const M={1:79.8,2:78.8,3:77.8,4:76.8,5:75.8,6:74.8,7:73.8,8:72.9,9:71.9,10:70.9,11:69.9,12:68.9,13:67.9,14:66.9,15:65.9,16:64.9,17:64,18:62.9,19:62,20:61,21:60,22:59,23:58.1,24:57.1,25:56.1,26:55.1,27:54.2,28:53.2,29:52.2,30:51.3,31:50.3,32:49.3,33:48.4,34:47.4,35:46.4,36:45.5,37:44.5,38:43.6,39:42.6,40:41.6,41:40.7,42:39.7,43:38.8,44:37.9,45:36.9,46:36,47:35,48:34.1,49:33.2,50:32.3,51:31.4,52:30.4,53:29.5,54:28.7,55:27.8,56:26.9,57:26,58:25.1,59:24.3,60:23.4,61:22.6,62:21.7,63:20.9,64:20,65:19.2,66:18.4,67:17.6,68:16.8,69:16,70:15.2,71:14.5,72:13.7,73:13,74:12.3,75:11.6,76:10.9,77:10.2,78:9.5,79:8.9,80:8.3,81:7.7,82:7.1,83:6.6,84:6.2,85:5.7,86:5.3,87:4.9,88:4.5,89:4.2,90:3.9,91:3.6,92:3.3,93:3.1,94:2.8,95:2.6,96:2.4,97:2.3,98:2.1,99:2,100:1.8};
const F={1:85.6,2:84.6,3:83.6,4:82.6,5:81.6,6:80.7,7:79.7,8:78.7,9:77.7,10:76.7,11:75.7,12:74.7,13:73.7,14:72.7,15:71.7,16:70.7,17:69.7,18:68.8,19:67.8,20:66.8,21:65.8,22:64.8,23:63.8,24:62.9,25:61.9,26:60.9,27:59.9,28:58.9,29:58,30:57,31:56,32:55,33:54,34:53.1,35:52.1,36:51.1,37:50.1,38:49.2,39:48.2,40:47.2,41:46.3,42:45.3,43:44.3,44:43.4,45:42.4,46:41.5,47:40.5,48:39.5,49:38.6,50:37.6,51:36.7,52:35.7,53:34.8,54:33.8,55:32.9,56:32,57:31,58:30.1,59:29.1,60:28.2,61:27.3,62:26.3,63:25.4,64:24.5,65:23.6,66:22.6,67:21.7,68:20.8,69:19.9,70:19,71:18.1,72:17.3,73:16.4,74:15.5,75:14.7,76:13.9,77:13,78:12.3,79:11.5,80:10.7,81:10,82:9.3,83:8.7,84:8.1,85:7.5,86:6.9,87:6.4,88:5.9,89:5.5,90:5,91:4.7,92:4.3,93:4,94:3.7,95:3.4,96:3.1,97:2.9,98:2.7,99:2.5,100:2.2};
function ex(age,sex){age=Math.max(0,Math.min(100,Math.round(age||0)));if(age===0)return sex==="f"?86.4:80.6;return (sex==="f"?F:M)[age];}
const seed=[["배우자",40,"f",300,250,12,2,0],["아버지",72,"m",12,8,2,1,24],["어머니",69,"f",12,8,2,1,24],["형제",39,"m",6,4,1,0.5,12],["친구",42,"m",8,6,2,1,12]];
const tbody=document.getElementById("people");
function row(d){const tr=document.createElement("tr");tr.innerHTML=`<td><input value="${d[0]}" style="width:88px"></td><td><input type="number" value="${d[1]}" min="0" max="100"></td><td><select><option value="m" ${d[2]==="m"?"selected":""}>남</option><option value="f" ${d[2]==="f"?"selected":""}>여</option></select></td><td><input type="number" value="${d[3]}" min="0"></td><td><input type="number" value="${d[4]}" min="0"></td><td><input type="number" value="${d[5]}" min="0" step="0.5"></td><td><input type="number" value="${d[6]}" min="0" step="0.5"></td><td><input type="number" value="${d[7]}" min="0"></td><td><button class="del" type="button">삭제</button></td>`;tr.querySelector(".del").onclick=()=>{tr.remove();calc();};tr.querySelectorAll("input,select").forEach(el=>el.addEventListener("input",calc));tbody.appendChild(tr);}
seed.forEach(row);
document.getElementById("addBtn").onclick=()=>{row(["",40,"m",4,2,1,0.5,6]);calc();};
["myAge","mySex","buffer","rate"].forEach(id=>document.getElementById(id).addEventListener("input",calc));
function n(v){return Math.round(v).toLocaleString("ko-KR");}
function calc(){const buffer=+document.getElementById("buffer").value||0;const rate=(+document.getElementById("rate").value||0)/100;const myActive=Math.max(0,ex(+document.getElementById("myAge").value,document.getElementById("mySex").value)-buffer);document.getElementById("myKpi").innerHTML=`<div>기대여명<b>${ex(+document.getElementById("myAge").value,document.getElementById("mySex").value).toFixed(1)}년</b></div><div>같이 움직일 해<b>${myActive.toFixed(1)}년</b></div><div>성사율<b>${Math.round(rate*100)}%</b></div>`;const out=document.getElementById("out");out.innerHTML="";[...tbody.rows].forEach(tr=>{const q=tr.querySelectorAll("input,select");const e=ex(+q[1].value||0,q[2].value);const overlap=Math.max(0,Math.min(myActive,Math.max(0,e-buffer)));const freq=[3,4,5,6,7].map(i=>+q[i].value||0);const cells=freq.map(f=>n(f*overlap*rate));const tr2=document.createElement("tr");tr2.innerHTML=`<td>${q[0].value||"(이름)"}</td><td>${e.toFixed(1)}</td><td class="years">${overlap.toFixed(1)}</td><td>${cells[0]}</td><td>${cells[1]}</td><td>${cells[2]}</td><td class="trip">${cells[3]}</td><td>${cells[4]}</td>`;out.appendChild(tr2);});}
calc();
</script>
</body>
</html>
